<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Board">
<title>My Board | Customer Success Workspace</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20192%20192%22%3E%3Crect%20width%3D%22192%22%20height%3D%22192%22%20rx%3D%2244%22%20fill%3D%22%23116b57%22/%3E%3Crect%20x%3D%2238%22%20y%3D%2235%22%20width%3D%22116%22%20height%3D%22122%22%20rx%3D%2222%22%20fill%3D%22%23f7fffc%22/%3E%3Cpath%20d%3D%22M61%2076l12%2012%2022-25M61%20118l12%2012%2022-25%22%20fill%3D%22none%22%20stroke%3D%22%23159a74%22%20stroke-width%3D%2210%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M112%2077h20M112%20119h20%22%20stroke%3D%22%239bcabc%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<meta property="og:title" content="My Board – Task & Notes Tracker">
<meta property="og:description" content="A lightweight task and call-notes tracker for managing client accounts.">
<meta property="og:image" content="https://sahanamadhavan26.github.io/My-Board/preview.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
[data-theme="dark"]{
  --bg:#0F1117;--surface:#1A1D27;--surface2:#22263A;--surface3:#2A2F45;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#F0F0F0;--text2:#A0A8B8;--muted:#6B7280;
  --accent:#1D9E75;--accent-l:rgba(29,158,117,0.18);
  --blue:#4A9EE8;--blue-l:rgba(74,158,232,0.15);
  --amber:#F5A623;--amber-l:rgba(245,166,35,0.15);
  --red:#E24B4A;--red-l:rgba(226,75,74,0.15);
  --sum-bg:rgba(29,158,117,0.1);--sum-bd:rgba(29,158,117,0.25);--sum-t:#5DCAA5;
}
[data-theme="light"]{
  --bg:#F2F0EB;--surface:#FFFFFF;--surface2:#F7F5F0;--surface3:#EDEAE3;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --text:#1A1A1A;--text2:#555;--muted:#999;
  --accent:#1D9E75;--accent-l:rgba(29,158,117,0.1);
  --blue:#1A6FD4;--blue-l:rgba(26,111,212,0.1);
  --amber:#B87800;--amber-l:rgba(184,120,0,0.1);
  --red:#C0392B;--red-l:rgba(192,57,43,0.1);
  --sum-bg:rgba(29,158,117,0.07);--sum-bd:rgba(29,158,117,0.18);--sum-t:#0F6E56;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;min-height:100vh;transition:background .25s,color .25s;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* HEADER */
.hdr{background:var(--surface);border-bottom:.5px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:30;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hdr h1{font-size:19px;font-weight:700;}
.hdr-date{font-size:12px;color:var(--muted);margin-top:2px;}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.theme-btn{background:var(--surface2);border:.5px solid var(--border2);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--text2);font-family:inherit;}
.add-btn{background:var(--accent);color:white;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.icon-btn{position:relative;background:var(--surface2);border:.5px solid var(--border2);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:15px;flex-shrink:0;padding:0;}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;overflow:hidden;cursor:pointer;border:none;flex-shrink:0;padding:0;font-family:inherit;}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.avatar svg{width:60%;height:60%;}
.avatar.lg{width:84px;height:84px;font-size:30px;cursor:default;}

/* MODE TOGGLE */
.mode-tog{display:flex;background:var(--surface2);border:.5px solid var(--border2);border-radius:20px;padding:3px;gap:2px;flex-shrink:0;}
.mode-tog button{border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:5px 10px;border-radius:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.mode-tog button.active{background:var(--accent);color:#fff;}
.rem-mode{font-size:11px;}

/* REMINDER BANNER */
.rem-banner{display:flex;align-items:center;gap:10px;margin:12px 16px 0;padding:10px 12px 10px 14px;border-radius:10px;background:var(--amber-l);border:.5px solid var(--amber);font-size:13px;}
.rem-banner-text{flex:1;font-weight:500;}
.rem-banner .tb{font-size:12px;}
.rem-x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;font-family:inherit;}

/* MOBILE CHIPS */
.mob-bar{background:var(--surface2);border-bottom:.5px solid var(--border);padding:10px 16px;display:none;}
.mob-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.mob-lbl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.mob-lbl-row .mob-lbl{margin-bottom:0;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 15px;font-size:13px;font-weight:500;border-radius:20px;border:.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:6px;font-family:inherit;}
.chip .cdot{width:8px;height:8px;border-radius:50%;background:var(--ac,#1D9E75);flex-shrink:0;}
.chip.active{color:var(--ac,var(--accent));border-color:var(--ac,var(--accent));}
.chip.add{border-style:dashed;}

/* STATS - clickable */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:12px 16px;}
.stat{background:var(--surface);border-radius:10px;padding:12px;border:.5px solid var(--border);text-align:center;cursor:pointer;transition:all .15s;}
.stat:hover{border-color:var(--border2);}
.stat.active-filter{border-width:2px;}
.stat-n{font-size:22px;font-weight:700;}
.stat-l{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em;}

/* LAYOUT */
.main{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 145px);}
.sidebar{background:var(--surface);border-right:.5px solid var(--border);padding:12px;overflow-y:auto;}
.sb-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 4px 8px;}
.search{width:100%;background:var(--surface2);border:.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text);font-family:inherit;margin-bottom:10px;}
.search:focus{outline:none;border-color:var(--accent);}
.search::placeholder{color:var(--muted);}
.acct-item{padding:10px;border-radius:9px;cursor:pointer;margin-bottom:4px;border:.5px solid transparent;transition:all .15s;display:flex;align-items:center;gap:10px;}
.acct-item:hover{background:var(--surface2);}
.acct-item.active{border-color:var(--ac,var(--accent));}
.acct-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.acct-info{flex:1;min-width:0;}
.acct-reorder{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
.reorder-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:10px;padding:2px 4px;border-radius:4px;line-height:1;font-family:inherit;}
.reorder-btn:hover{background:var(--surface2);color:var(--text);}
.reorder-btn:disabled{opacity:.25;cursor:default;}
.reorder-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;border:.5px solid var(--border);margin-bottom:6px;}
.reorder-name{flex:1;font-size:14px;font-weight:500;}
.acct-name{font-size:13px;font-weight:500;}
.acct-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.acct-tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.stag{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;}
.add-acct-btn{width:100%;margin-top:10px;padding:9px;font-size:13px;font-weight:500;background:var(--accent-l);color:var(--accent);border:.5px solid var(--accent);border-radius:8px;cursor:pointer;font-family:inherit;}

/* DETAIL */
.detail{padding:20px;overflow-y:auto;}
.empty-st{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:var(--muted);font-size:14px;gap:12px;text-align:center;}
.det-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:10px;}
.det-name{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;}
.det-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.det-contact{font-size:12px;color:var(--muted);margin-top:3px;}
.del-btn{background:none;border:.5px solid var(--red-l);color:var(--red);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0;}
.tab-row{display:flex;gap:4px;margin-bottom:18px;background:var(--surface2);border-radius:10px;padding:4px;}
.dtab{flex:1;padding:8px;font-size:13px;font-weight:500;border:none;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s;}
.dtab.active{background:var(--surface);color:var(--text);}
.dsec{display:none;}.dsec.active{display:block;}

/* ADD TASK FORM */
.add-card{background:var(--surface);border-radius:14px;border:.5px solid var(--border);padding:16px;margin-bottom:20px;}
.add-card-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;}
.f{width:100%;background:var(--surface2);border:.5px solid var(--border);border-radius:9px;padding:11px 13px;font-size:14px;color:var(--text);font-family:inherit;margin-bottom:10px;}
.f::placeholder{color:var(--muted);}
.f:focus{outline:none;border-color:var(--accent);background:var(--surface);}
select.f{-webkit-appearance:none;}
textarea.f{resize:none;line-height:1.5;}
.fl{font-size:11px;font-weight:500;color:var(--muted);margin-bottom:5px;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.add-btn2{width:100%;padding:13px;font-size:14px;font-weight:600;background:var(--accent);color:white;border:none;border-radius:9px;cursor:pointer;font-family:inherit;margin-top:4px;}
.add-btn2:disabled{opacity:.5;}

/* FILTER BAR */
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.fb{padding:7px 14px;font-size:12px;font-weight:600;border-radius:20px;border:.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:5px;}
.fb:hover{border-color:var(--border2);}
.fb.active{color:white;border-color:transparent;}
.fb.f-all.active{background:var(--surface3);color:var(--text);}
.fb.f-todo.active{background:var(--amber);border-color:var(--amber);}
.fb.f-inprog.active{background:var(--blue);border-color:var(--blue);}
.fb.f-done.active{background:var(--accent);border-color:var(--accent);}
.fb.f-hold.active{background:var(--red);border-color:var(--red);}
.fb-count{font-size:11px;font-weight:700;padding:1px 6px;border-radius:20px;background:rgba(255,255,255,0.2);}

/* KANBAN COLS */
.kb-wrap{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
.k-col{background:var(--surface);border-radius:14px;border:.5px solid var(--border);overflow:hidden;}
.k-col-hdr{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.k-col-left{display:flex;align-items:center;gap:9px;}
.k-dot{width:10px;height:10px;border-radius:50%;}
.k-title{font-size:14px;font-weight:600;}
.k-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;}
.k-divider{height:.5px;background:var(--border);}
.k-cards{padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.k-empty{padding:18px;text-align:center;font-size:13px;color:var(--muted);opacity:.5;}

.c-todo{border-left:3px solid var(--amber);}
.c-todo .k-dot{background:var(--amber);}
.c-todo .k-title{color:var(--amber);}
.c-todo .k-badge{background:var(--amber-l);color:var(--amber);}
.c-inprog{border-left:3px solid var(--blue);}
.c-inprog .k-dot{background:var(--blue);}
.c-inprog .k-title{color:var(--blue);}
.c-inprog .k-badge{background:var(--blue-l);color:var(--blue);}
.c-hold{border-left:3px solid var(--red);}
.c-hold .k-dot{background:var(--red);}
.c-hold .k-title{color:var(--red);}
.c-hold .k-badge{background:var(--red-l);color:var(--red);}

/* TASK CARD */
.task-card{background:var(--surface2);border-radius:10px;border:.5px solid var(--border);padding:13px 14px;cursor:pointer;transition:all .15s;}
.task-card:hover{border-color:var(--border2);background:var(--surface3);}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.tc-text{font-size:14px;color:var(--text);line-height:1.4;flex:1;}
.tc-text.done{text-decoration:line-through;color:var(--muted);}
.tc-pri{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0;}
.ph{background:var(--red-l);color:var(--red);}
.pm{background:var(--amber-l);color:var(--amber);}
.pl{background:var(--accent-l);color:var(--accent);}
.tc-meta{display:flex;align-items:center;justify-content:flex-start;gap:8px;flex-wrap:wrap;}
.tc-pills{display:flex;gap:6px;flex-wrap:wrap;}
.tc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:.5px solid var(--border);}
.tb-delete{background:var(--red-l);color:var(--red);border:.5px solid var(--red);border-radius:7px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.tb-delete:hover{background:var(--red);color:#fff;}
.tc-pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--text2);background:var(--surface);padding:3px 8px;border-radius:20px;}
.tc-pill.ov{color:var(--red);background:var(--red-l);}
.tb{background:var(--surface);border:.5px solid var(--border2);border-radius:7px;padding:5px 9px;font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;}
.tb.tf:hover{color:var(--accent);border-color:var(--accent);}
.tb.tb2:hover{color:var(--blue);border-color:var(--blue);}

/* COMPLETED SECTION */
.completed-section{margin-top:8px;}
.completed-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-radius:14px;cursor:pointer;border:.5px solid var(--border);margin-bottom:0;transition:all .15s;}
.completed-hdr:hover{background:var(--surface2);}
.completed-hdr-left{display:flex;align-items:center;gap:9px;}
.completed-hdr h3{font-size:14px;font-weight:600;color:var(--accent);}
.completed-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--accent-l);color:var(--accent);}
.completed-chevron{font-size:12px;color:var(--muted);transition:transform .2s;}
.completed-chevron.open{transform:rotate(180deg);}
.completed-body{background:var(--surface);border:.5px solid var(--border);border-top:none;border-radius:0 0 14px 14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.done-card{background:var(--surface2);border-radius:10px;border:.5px solid var(--border);padding:12px 14px;opacity:.7;cursor:pointer;transition:all .15s;}
.done-card:hover{opacity:1;border-color:var(--border2);}
.done-card-text{font-size:13px;color:var(--muted);text-decoration:line-through;margin-bottom:7px;}
.done-card-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.done-pills{display:flex;gap:5px;flex-wrap:wrap;}
.done-check{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-l);padding:2px 8px;border-radius:20px;}

/* DRAWERS */
.dov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:40;}
.dov.open{display:block;}
.drawer{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:18px 18px 0 0;border-top:.5px solid var(--border);z-index:41;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);visibility:hidden;}
.drawer.open{transform:translateY(0);visibility:visible;}
@media(min-width:641px){
  .drawer{left:50%;right:auto;width:560px;transform:translate(-50%,100%);}
  .drawer.open{transform:translate(-50%,0);}
}
.dr-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:14px auto 0;}
.dr-inner{padding:16px 20px 34px;}
.dr-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:10px;}
.dr-title{font-size:18px;font-weight:700;line-height:1.3;flex:1;}
.dr-close{background:var(--surface2);border:.5px solid var(--border);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--muted);flex-shrink:0;font-family:inherit;}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.dg{background:var(--surface2);border-radius:10px;padding:12px 14px;}
.dg-l{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.dg-v{font-size:14px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:6px;}
.dg-v.amber{color:var(--amber);}
.dg-v.blue{color:var(--blue);}
.dg-v.green{color:var(--accent);}
.dg-v.red,.dg-v.ov{color:var(--red);}
.dr-acts{display:flex;gap:8px;flex-wrap:wrap;}
.da{flex:1;min-width:100px;padding:11px;font-size:13px;font-weight:500;border:.5px solid var(--border2);border-radius:9px;cursor:pointer;font-family:inherit;background:var(--surface2);color:var(--text2);transition:all .15s;}
.da.fwd{background:var(--accent-l);color:var(--accent);border-color:var(--accent);}
.da.bck{background:var(--blue-l);color:var(--blue);border-color:var(--blue);}
.da.del{background:var(--red-l);color:var(--red);border-color:var(--red);}

/* PROFILE */
.pf-top{display:flex;align-items:center;gap:16px;margin-bottom:6px;}
.pf-photo-btns{display:flex;gap:8px;flex-wrap:wrap;}
.pf-sec{border-top:.5px solid var(--border);padding-top:16px;margin-top:16px;}
.pf-sec-title{font-size:13px;font-weight:700;margin-bottom:12px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
.row-label{font-size:14px;font-weight:500;}
.row-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4;}
.switch{position:relative;width:44px;height:26px;flex-shrink:0;display:inline-block;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.slider{position:absolute;inset:0;background:var(--surface3);border:.5px solid var(--border2);border-radius:13px;cursor:pointer;transition:.2s;}
.slider:before{content:'';position:absolute;width:20px;height:20px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked+.slider{background:var(--accent);border-color:var(--accent);}
.switch input:checked+.slider:before{transform:translateX(18px);}
.switch input:focus-visible+.slider{outline:2px solid var(--accent);outline-offset:2px;}
.seg{display:flex;background:var(--surface2);border-radius:9px;padding:3px;gap:3px;}
.seg button{flex:1;padding:8px 12px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
.seg button.active{background:var(--surface);color:var(--text);}
.hint{font-size:12px;color:var(--muted);line-height:1.5;}
.hint.warn{color:var(--amber);margin-top:-4px;margin-bottom:12px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.btn-row .tb{font-size:12px;padding:8px 12px;}

/* REMINDERS LIST */
.rem-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--surface2);margin-bottom:8px;cursor:pointer;border:.5px solid var(--border);width:100%;text-align:left;font-family:inherit;color:var(--text);}
.rem-item:hover{border-color:var(--border2);}
.rem-main{flex:1;min-width:0;}
.rem-text{font-size:14px;line-height:1.35;}
.rem-acct{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px;}
.rem-when{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;flex-shrink:0;}
.rem-when.ov{background:var(--red-l);color:var(--red);}
.rem-when.td{background:var(--amber-l);color:var(--amber);}
.rem-when.tm{background:var(--blue-l);color:var(--blue);}

/* NOTES */
.note-card{background:var(--surface);border-radius:14px;border:.5px solid var(--border);margin-bottom:12px;overflow:hidden;}
.nc-hdr{padding:14px 16px;border-bottom:.5px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.nc-title{font-size:15px;font-weight:600;}
.nc-subject{font-size:12px;color:var(--muted);margin-top:3px;}
.nc-meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.nc-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);background:var(--surface2);padding:4px 10px;border-radius:20px;}
.nc-del{background:var(--red-l);color:var(--red);border:.5px solid var(--red);cursor:pointer;font-size:12px;font-weight:600;padding:6px 12px;border-radius:7px;flex-shrink:0;font-family:inherit;}
.nc-del:hover{background:var(--red);color:#fff;}
.nc-body{padding:14px 16px;}
.sum-box{background:var(--sum-bg);border:.5px solid var(--sum-bd);border-radius:10px;padding:13px 15px;margin-bottom:12px;}
.sum-lbl{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;}
.sum-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.sum-toggle{font-size:11px;font-weight:600;color:var(--accent);text-decoration:underline;flex-shrink:0;}
.sum-text{font-size:13px;color:var(--sum-t);line-height:1.7;white-space:pre-wrap;margin-top:8px;}
.tog-raw{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;}
.raw-box{background:var(--surface2);border-radius:8px;padding:12px;margin-top:10px;}
.raw-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px;}
.raw-text{font-size:12px;color:var(--muted);line-height:1.65;white-space:pre-wrap;}

/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:50;align-items:center;justify-content:center;padding:20px;}
.modal-ov.open{display:flex;}
.modal{background:var(--surface);border-radius:14px;border:.5px solid var(--border);padding:22px;width:100%;max-width:420px;}
.modal h3{font-size:16px;font-weight:600;margin-bottom:14px;}
.mf{width:100%;background:var(--surface2);border:.5px solid var(--border);border-radius:9px;padding:11px 13px;font-size:14px;color:var(--text);font-family:inherit;margin-bottom:10px;}
.mf:focus{outline:none;border-color:var(--accent);}
.mf::placeholder{color:var(--muted);}
.mbtns{display:flex;gap:8px;margin-top:4px;}
.mbtn{flex:1;padding:11px;font-size:14px;font-weight:500;border-radius:9px;cursor:pointer;font-family:inherit;border:none;}
.mbtn.c{background:var(--surface2);color:var(--muted);}
.mbtn.s{background:var(--accent);color:white;}

/* MODE */
.mode-personal .work-only,.mode-personal #stat-inprog{display:none!important;}
.mode-opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:16px;border-radius:12px;border:.5px solid var(--border2);background:var(--surface2);cursor:pointer;margin-bottom:10px;font-family:inherit;color:var(--text);transition:border-color .15s;}
.mode-opt:hover{border-color:var(--accent);}
.mode-ico{font-size:26px;line-height:1;}
.mode-t{font-size:15px;font-weight:600;}
.mode-s{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45;}
.welcome-sub{font-size:13px;color:var(--muted);line-height:1.5;margin:-6px 0 16px;}

/* TOAST */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:60;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:640px){
  .main{grid-template-columns:1fr}.sidebar{display:none}.mob-bar{display:block}
  .stats{grid-template-columns:repeat(3,1fr)}.r2,.r3{grid-template-columns:1fr}
  .detail{padding:14px}.dr-grid{grid-template-columns:1fr}
  .theme-btn{display:none}
  .mode-tog .mt-l{display:none}
  .mode-tog button{padding:5px 8px;font-size:14px;}
  .add-btn{padding:8px 11px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}

/* Delightful board upgrades */
.progress-ring{--pct:0;--ring:#1D9E75;width:42px;height:42px;border-radius:50%;background:conic-gradient(var(--ring) calc(var(--pct)*1%),var(--surface3) 0);display:grid;place-items:center;flex-shrink:0}
.progress-ring span{background:var(--surface);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--text)}
.acct-emoji{font-size:21px;flex-shrink:0}.emoji-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.emoji-picker button{font-size:22px;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:6px;cursor:pointer}.emoji-picker button.picked{border:2px solid var(--accent);background:var(--accent-l)}
.today-hero{background:linear-gradient(125deg,#115f50,#1d9e75);border-radius:18px;color:white;padding:24px;margin-bottom:18px}.today-hero h2{font-size:25px;margin-bottom:7px}.today-hero p{opacity:.88;font-size:13px}.today-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.today-tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px}.today-tile strong{display:block;font-size:24px}.today-tile span{font-size:12px;color:var(--muted)}.today-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;justify-content:space-between}.today-item button{cursor:pointer}.today-item small{color:var(--muted)}
.k-col.drop-target{outline:2px dashed var(--accent);background:var(--accent-l)}.task-card[draggable=true]{cursor:grab}.task-card.dragging{opacity:.35}.celebration{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}.confetti-piece{position:absolute;top:45%;left:50%;width:9px;height:13px;border-radius:2px;animation:confetti-pop 850ms ease-out forwards}@keyframes confetti-pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}@media(max-width:640px){.today-grid{grid-template-columns:repeat(3,1fr)}.today-hero{padding:18px}}

<div class="hdr">

    <div><h1>My Board</h1><div class="hdr-date" id="hdate"></div></div>

function loadBoard(mode){
  let list=[];
  try{list=JSON.parse(lsGet(storeKey(mode),'[]')||'[]');}catch(e){list=[];}
  if(!Array.isArray(list))list=[];
  list.forEach(a=>{
    a.tasks=a.tasks||[];a.notes=a.notes||[];
    a.notes.forEach(n=>{
      if(!n.dateRaw){
        const parsed=n.date?new Date(n.date):null;
        n.dateRaw=(parsed&&!isNaN(parsed))?isoOf(parsed):todayISO();

    });

  return list;
}

  list.forEach(a=>(a.tasks||[]).forEach(t=>{

function setBrowserNotif(on){

  if(!('Notification' in window)){notifMsg='notifUnsupported';profile.browserNotif=false;saveProfile();renderProfile();return;}

function handlePhoto(input){
  const file=input.files&&input.files[0];input.value='';
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const S=256,c=document.createElement('canvas');c.width=S;c.height=S;
      const ctx=c.getContext('2d');
      const side=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
      const prev=profile.photo;
      profile.photo=c.toDataURL('image/jpeg',0.85);
      if(!saveProfile()){profile.photo=prev;toast(tr('photoError'));return;}
      renderHeader();renderProfile();
    };
    img.onerror=()=>toast(tr('photoError'));
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

function handleImport(input){
  const file=input.files&&input.files[0];input.value='';
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data||!Array.isArray(data.accounts))throw new Error('bad');
      if(data.profile&&typeof data.profile==='object')profile=Object.assign({},DEFAULT_PROFILE,data.profile);
      profile.mode='work';
      if(!LANGS[profile.lang])profile.lang='en';
      lsSet(storeKey('work'),JSON.stringify(data.accounts));

    }catch(e){toast(tr('invalidBackup'));}
  };
  reader.readAsText(file);
}

/* ---------- REMINDERS ---------- */
function dueDiff(due){
  const d=new Date(due+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);
  return Math.round((d-today)/864e5);
}
function getReminders(){
  if(!profile.remindersOn)return [];
  const out=[];
  ['work','personal'].forEach(mode=>{
    const board=mode===curMode()?accounts:loadBoard(mode);
    board.forEach(a=>a.tasks.forEach(task=>{
      if(task.status==='done'||!task.due)return;
      const d=dueDiff(task.due);
      if(d<=0||(profile.lead===1&&d===1))out.push({a,task,d,mode,idx:board.indexOf(a)});
    }));
  });
  return out.sort((x,y)=>x.d-y.d);
}
function whenInfo(d){
  if(d<0)return {label:tr('overdue'),cls:'ov'};
  if(d===0)return {label:tr('dueToday'),cls:'td'};
  return {label:tr('dueTomorrow'),cls:'tm'};
}
function checkReminders(){
  const list=getReminders();
  const badge=document.getElementById('bell-badge');
  if(list.length){badge.style.display='flex';badge.textContent=list.length>99?'99+':list.length;}
  else badge.style.display='none';
  const banner=document.getElementById('rem-banner');
  if(list.length&&list.length!==bannerDismissedAt){
    banner.innerHTML=`<div class="rem-banner" role="status">
      <span>🔔</span>
      <span class="rem-banner-text">${list.length===1?tr('attention1'):tr('attentionN',{n:list.length})}</span>
      <button class="tb" onclick="openPanel('rem')">${tr('view')}</button>
      <button class="rem-x" onclick="dismissBanner(${list.length})" aria-label="${esc(tr('close'))}">×</button>
    </div>`;
  }else banner.innerHTML='';
  if(isOpen('rem'))renderReminderList();
  sendBrowserNotifs(list);
}
function openReminder(mode,aId,tId){
  closePanel('rem');
  if(mode!==curMode())setMode(mode);

function dismissBanner(n){bannerDismissedAt=n;document.getElementById('rem-banner').innerHTML='';}
function renderReminderList(){
  const list=getReminders();
  const el=document.getElementById('rem-list');
  if(!list.length){el.innerHTML=`<div style="text-align:center;padding:2rem 0;color:var(--muted);font-size:14px;">✓ ${tr('noReminders')}</div>`;return;}
  el.innerHTML=list.map(r=>{
    const w=whenInfo(r.d);
    const col=acColor(r.idx);
    return `<button class="rem-item" onclick="openReminder('${r.mode}',${r.a.id},${r.task.id})">
      <div class="rem-main">
        <div class="rem-text">${esc(r.task.text)}</div>
        <div class="rem-acct"><span class="rem-mode">${r.mode==='work'?'💼':'🏠'}</span><span style="width:7px;height:7px;border-radius:50%;background:${col};display:inline-block;"></span>${esc(r.a.name)} · ${fmtD(r.task.due)}</div>
      </div>
      <span class="rem-when ${w.cls}">${w.label}</span>
    </button>`;
  }).join('');
}
function sendBrowserNotifs(list){
  if(!profile.browserNotif||!('Notification' in window)||Notification.permission!=='granted'||!list.length)return;
  const day=todayISO();
  let sent={};try{sent=JSON.parse(lsGet('board-notified','{}'))||{};}catch(e){}
  Object.keys(sent).forEach(k=>{if(!k.endsWith('|'+day))delete sent[k];});
  list.forEach(r=>{
    const key=r.task.id+'|'+day;
    if(sent[key])return;
    try{new Notification(tr('reminderTitle'),{body:`${r.task.text} · ${r.a.name} (${whenInfo(r.d).label})`,tag:key});}catch(e){}
    sent[key]=1;
  });
  lsSet('board-notified',JSON.stringify(sent));
}

function matchesNotesDateFilter(dateRaw){
  if(notesDateFilter==='all')return true;
  if(!dateRaw)return false;
  if(notesDateFilter==='today')return dateRaw===todayISO();
  if(notesDateFilter==='week')return dateRaw>=daysAgoISO(7)&&dateRaw<=todayISO();
  if(notesDateFilter==='month')return dateRaw>=daysAgoISO(30)&&dateRaw<=todayISO();
  if(notesDateFilter==='custom'){
    if(notesCustomFrom&&dateRaw<notesCustomFrom)return false;
    if(notesCustomTo&&dateRaw>notesCustomTo)return false;
    return true;
  }
  return true;
}

function setNotesCustomRange(){notesCustomFrom=document.getElementById('nf-from').value;notesCustomTo=document.getElementById('nf-to').value;notesDateFilter='custom';renderGlobalView();}

function renderGlobalView(opts){
  opts=opts||{};
  if(globalFilter==='none')return;
  const el=document.getElementById('gv-list');
  const filtersEl=document.getElementById('gv-notes-filters');

  if(globalFilter==='notes'){
    filtersEl.style.display='block';
    if(!opts.skipFilterBar)filtersEl.innerHTML=renderNotesDateFilters();
    let notes=[];
    accounts.forEach(a=>a.notes.forEach(n=>notes.push({n,a})));
    notes=notes.filter(x=>matchesNotesDateFilter(x.n.dateRaw));
    if(notesAccountFilter!=='all')notes=notes.filter(x=>x.a.id===notesAccountFilter);
    if(notesSearchText.trim()){const q=notesSearchText.trim().toLowerCase();notes=notes.filter(x=>(x.n.title||'').toLowerCase().includes(q));}
    notes.sort((x,y)=>{const da=x.n.dateRaw||'',db=y.n.dateRaw||'';if(da&&db&&da!==db)return db.localeCompare(da);return y.n.id-x.n.id;});
    if(!notes.length){el.innerHTML=`<div style="text-align:center;padding:3rem;color:var(--muted);font-size:14px;">${tr('noNotesMatch')}</div>`;return;}
    el.innerHTML=notes.map(({n,a})=>{
      const col=acColor(acIdx(a.id));
      return noteCard(n,a.id,`<span class="nc-pill" style="background:${col}22;color:${col};">● ${esc(a.name)}</span>`);

  filtersEl.style.display='none';

  el.innerHTML=tasks.map(({task,a})=>{
    const col=acColor(acIdx(a.id));

        <span class="tc-pill" style="background:${col}22;color:${col};">● ${esc(a.name)}</span>

        ${task.due?`<span class="tc-pill ${ov?'ov':''}">📅 ${fmtD(task.due)}</span>`:''}

/* ---------- TASK HELPERS ---------- */
function isOv(due){if(!due)return false;return new Date(due+'T00:00:00')<new Date(new Date().toDateString());}
function fmtD(due){
  if(!due)return '';
  const diff=dueDiff(due);
  if(diff===0)return tr('today');if(diff===1)return tr('tomorrow');if(diff===-1)return tr('yesterday');
  if(diff<0)return tr('overdueN',{n:Math.abs(diff)});if(diff<7)return tr('inN',{n:diff});
  return new Date(due+'T00:00:00').toLocaleDateString(LOCALES[profile.lang],{month:'short',day:'numeric'});
}
function stLabel(s){return{todo:tr('todo'),inprog:tr('inProgress'),done:tr('done'),pending:tr('onHold')}[s]||s;}
function stClass(s){return{todo:'amber',inprog:'blue',done:'green',pending:'red'}[s]||'';}
function stColorVar(s){return{todo:'amber',inprog:'blue',done:'accent',pending:'red'}[s]||'text';}

/* ---------- TASK DRAWER ---------- */
function openDrawer(aId,tId){
  const a=accounts.find(a=>a.id===aId);const task=a&&a.tasks.find(x=>x.id===tId);
  if(!a||!task)return;
  drawerAcct=aId;drawerTask=tId;
  const col=acColor(acIdx(aId));
  const ov=isOv(task.due)&&task.status!=='done';
  const priCol={high:'red',medium:'amber',low:'green'}[task.priority]||'';
  document.getElementById('dr-title').textContent=task.text;
  document.getElementById('dr-grid').innerHTML=`
    <div class="dg"><div class="dg-l">${tr('status')}</div><div class="dg-v ${stClass(task.status)}">${stLabel(task.status)}</div></div>
    <div class="dg"><div class="dg-l">${tr('account')}</div><div class="dg-v"><span style="width:9px;height:9px;border-radius:50%;background:${col};display:inline-block;"></span>${esc(a.name)}</div></div>
    <div class="dg"><div class="dg-l">${tr('dueDate')}</div><div class="dg-v ${ov?'ov':''}">${task.due?fmtD(task.due):tr('notSet')}</div></div>
    <div class="dg work-only"><div class="dg-l">${tr('assignee')}</div><div class="dg-v">${task.assignee?esc(task.assignee):tr('unassigned')}</div></div>
    <div class="dg"><div class="dg-l">${tr('priority')}</div><div class="dg-v ${priCol}">${task.priority?tr(task.priority):tr('none')}</div></div>
    <div class="dg"><div class="dg-l">${tr('created')}</div><div class="dg-v" style="font-size:12px;">${new Date(task.id).toLocaleDateString(LOCALES[profile.lang],{month:'short',day:'numeric',year:'numeric'})}</div></div>`;
  const canF=task.status!=='done'&&task.status!=='pending';
  const canB=isWork()?(task.status==='inprog'||task.status==='done'):task.status==='done';
  const nextL=isWork()?({todo:'→ '+tr('inProgress'),inprog:'✓ '+tr('markDone')}[task.status]||''):'✓ '+tr('markDone');
  const prevL=isWork()?({inprog:'← '+tr('todo'),done:'← '+tr('inProgress')}[task.status]||''):'← '+tr('todo');
  document.getElementById('dr-acts').innerHTML=`
    ${canB?`<button class="da bck" onclick="drawerMove('b')">${prevL}</button>`:''}
    ${canF?`<button class="da fwd" onclick="drawerMove('f')">${nextL}</button>`:''}
    ${isWork()&&task.status!=='done'?`<button class="da" onclick="drawerHold()">${task.status==='pending'?'▶ '+tr('resume'):'⏸ '+tr('putOnHold')}</button>`:''}
    <button class="da" onclick="enterTaskEdit()">✎ ${tr('editTask')}</button>
    <button class="da del" onclick="drawerDelete()">${tr('deleteTask')}</button>`;
  document.getElementById('dr-grid').style.display='grid';
  document.getElementById('dr-acts').style.display='flex';
  document.getElementById('dr-edit').style.display='none';
  document.getElementById('dr-edit').innerHTML='';
  document.getElementById('dov').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){document.getElementById('dov').classList.remove('open');document.getElementById('drawer').classList.remove('open');drawerAcct=null;drawerTask=null;}

function enterTaskEdit(){
  const a=accounts.find(a=>a.id===drawerAcct);const task=a&&a.tasks.find(x=>x.id===drawerTask);
  if(!a||!task)return;
  populateAssigneeOptions();
  document.getElementById('dr-grid').style.display='none';
  document.getElementById('dr-acts').style.display='none';
  const ed=document.getElementById('dr-edit');

  ed.innerHTML=`

      <div><p class="fl">${tr('status')}</p>
        <select class="f" id="de-status">${opt('todo',task.status,tr('todo'))}${isWork()?opt('inprog',task.status,tr('inProgress'))+opt('pending',task.status,tr('onHold')):''}${opt('done',task.status,tr('done'))}</select></div>

    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
      <div><p class="fl">${tr('dueDate')}</p><input class="f" id="de-due" type="date" value="${task.due||''}" /></div>
      <div class="work-only"><p class="fl">${tr('assignee')}</p><input class="f" id="de-assignee" list="assignee-options" value="${esc(task.assignee||'')}" /></div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="da fwd" onclick="saveTaskEdit()">${tr('saveChanges')}</button>
      <button class="da" onclick="openDrawer(drawerAcct,drawerTask)">${tr('cancel')}</button>
    </div>`;
}
function saveTaskEdit(){
  const a=accounts.find(a=>a.id===drawerAcct);const task=a&&a.tasks.find(x=>x.id===drawerTask);
  if(!a||!task)return;
  const text=document.getElementById('de-text').value.trim();if(!text)return;
  task.text=text;
  const previousStatus=task.status;task.status=document.getElementById('de-status').value;
  task.priority=document.getElementById('de-priority').value;
  task.due=document.getElementById('de-due').value;
  task.assignee=isWork()?document.getElementById('de-assignee').value.trim():task.assignee;
  afterTaskChange();if(previousStatus!=="done"&&task.status==="done")celebrate();
  openDrawer(drawerAcct,drawerTask);
}
function afterTaskChange(){save();if(sel)renderDetail();else renderToday();renderAll();renderGlobalView();checkReminders();}
function drawerMove(d){moveTask(drawerAcct,drawerTask,d);openDrawer(drawerAcct,drawerTask);}
function drawerHold(){setPending(drawerAcct,drawerTask);openDrawer(drawerAcct,drawerTask);}
function drawerDelete(){if(deleteTask(drawerAcct,drawerTask))closeDrawer();}

function moveTask(aId,tId,d){
  const a=accounts.find(a=>a.id===aId);const task=a.tasks.find(x=>x.id===tId);
  const flow=isWork()?['todo','inprog','done']:['todo','done'];const i=flow.indexOf(task.status);
  const previous=task.status;
  if(d==='f'&&i<flow.length-1)task.status=flow[i+1];else if(d==='b'&&i>0)task.status=flow[i-1];
  afterTaskChange();if(previous!=='done'&&task.status==='done')celebrate();
}
function setPending(aId,tId){
  const a=accounts.find(a=>a.id===aId);const task=a.tasks.find(x=>x.id===tId);
  task.status=task.status==='pending'?'todo':'pending';
  afterTaskChange();
}
function deleteTask(aId,tId){
  if(!confirm(tr('confirmDelete')))return false;
  const a=accounts.find(a=>a.id===aId);a.tasks=a.tasks.filter(x=>x.id!==tId);
  afterTaskChange();return true;
}

          <div><p class="fl">${tr('dueDate')}</p><input class="f" id="tk-due" type="date" style="margin-bottom:0;" /></div>
        </div>
        <div class="work-only" style="margin-top:10px;"><p class="fl">${tr('assignee')}</p><input class="f" id="tk-as" list="assignee-options" placeholder="${esc(tr('assigneePh'))}" style="margin-bottom:12px;" /><datalist id="assignee-options"></datalist></div>
        <button class="add-btn2" style="margin-top:12px;" onclick="addTask(${a.id})">${tr('addTask')}</button>

      <div class="filter-bar">
        ${fb('all','f-all',tr('all'),allTasks.length)}
        ${fb('todo','f-todo',tr('todo'),todo.length)}
        ${isWork()?fb('inprog','f-inprog',tr('inProgress'),inprog.length):''}
        ${fb('done','f-done',tr('done'),done.length)}
        ${isWork()&&hold.length>0?fb('hold','f-hold',tr('onHold'),hold.length):''}
      </div>

      <div class="kb-wrap">
        ${taskFilter==='all'||taskFilter==='todo'?kCol('c-todo',tr('todo'),todo,a.id):''}
        ${isWork()&&(taskFilter==='all'||taskFilter==='inprog')?kCol('c-inprog',tr('inProgress'),inprog,a.id):''}
        ${isWork()&&(taskFilter==='all'||taskFilter==='hold')&&hold.length>0?kCol('c-hold',tr('onHold'),hold,a.id):''}
      </div>

      ${(taskFilter==='all'||taskFilter==='done')?`
      <div class="completed-section k-col" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)" ondrop="dropTask(event,${a.id},'done')">
        <div class="completed-hdr" onclick="toggleCompleted()" style="border-radius:${completedOpen?'14px 14px 0 0':'14px'};">
          <div class="completed-hdr-left">
            <span style="width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;"></span>
            <h3>${tr('completed')}</h3>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="completed-badge">${done.length}</span>
            <span class="completed-chevron ${completedOpen?'open':''}">▼</span>
          </div>
        </div>
        ${completedOpen?`<div class="completed-body">
          ${done.map(task=>`
            <div class="done-card" onclick="openDrawer(${a.id},${task.id})">
              <div class="done-card-text">${esc(task.text)}</div>
              <div class="done-card-meta"><div class="done-pills">
                ${task.due?`<span class="tc-pill">📅 ${fmtD(task.due)}</span>`:''}
                ${task.assignee?`<span class="tc-pill work-only">👤 ${esc(task.assignee)}</span>`:''}
                <span class="done-check">✓ ${tr('done')}</span>
              </div></div>
              <div class="tc-actions" onclick="event.stopPropagation()">
                <button class="tb tb2" onclick="moveTask(${a.id},${task.id},'b')">↩ ${tr('reopen')}</button>
                <button class="tb-delete" onclick="deleteTask(${a.id},${task.id})">${tr('delete')}</button>

            </div>`).join('')}
        </div>`:''}
      </div>`:''}
    </div>

    <div class="dsec" id="ds-notes">
      <div class="add-card">
        <p class="add-card-title">${tr('newCallNote')}</p>
        <p class="fl">${tr('callTitle')}</p><input class="f" id="nt-title" placeholder="${esc(tr('callTitlePh'))}" />
        <div class="work-only"><p class="fl">${tr('subject')}</p><input class="f" id="nt-sub" placeholder="${esc(tr('subjectPh'))}" /></div>
        <div class="r2">
          <div><p class="fl">${tr('date')}</p><input class="f" id="nt-date" type="date" style="margin-bottom:0;" /></div>
          <div class="work-only"><p class="fl">${tr('attendees')}</p><input class="f" id="nt-att" placeholder="${esc(tr('attendeesPh'))}" style="margin-bottom:0;" /></div>
        </div>
        <p class="fl" style="margin-top:10px;">${tr('notes')}</p>
        <textarea class="f" id="nt-body" placeholder="${esc(tr('notesPh'))}" style="min-height:120px;margin-bottom:12px;"></textarea>
        <button class="add-btn2" onclick="addNote(${a.id})">${tr('saveNote')}</button>
      </div>
      ${a.notes.length?a.notes.map(n=>noteCard(n,a.id,'')).join(''):`<div style="font-size:13px;color:var(--muted);padding:4px 0;">${tr('noNotes')}</div>`}
    </div>`;
  switchTab(curTab);
  populateAssigneeOptions();
}

function populateAssigneeOptions(){
  const dl=document.getElementById('assignee-options');
  if(!dl)return;
  const used=new Set();
  if(profile.name.trim())used.add(profile.name.trim());
  ['Me','Dev team','Customer'].forEach(d=>used.add(d));
  accounts.forEach(a=>a.tasks.forEach(x=>{if(x.assignee)used.add(x.assignee);}));
  dl.innerHTML=[...used].map(v=>`<option value="${esc(v)}"></option>`).join('');
}

function addTask(aId){
  const text=document.getElementById('tk-text').value.trim();
  if(!text){document.getElementById('tk-text').focus();return;}
  const a=accounts.find(a=>a.id===aId);
  a.tasks.unshift({id:Date.now(),text,status:document.getElementById('tk-st').value,priority:document.getElementById('tk-pr').value,due:document.getElementById('tk-due').value,assignee:isWork()?document.getElementById('tk-as').value.trim():''});
  afterTaskChange();
}

/* ---------- NOTES ---------- */
function localSummarize(body,sub,att){
  const lines=body.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  let sentences=[];
  lines.forEach(l=>{l.split(/(?<=[.!?])\s+/).forEach(s=>{if(s.trim())sentences.push(s.trim());});});
  if(!sentences.length)sentences=[body.trim()];
  const actionWords=/\b(will|need to|needs to|should|must|to do|todo|action|follow up|follow-up|let's|lets|plan to|going to|next step|next steps|assign|ship|send|review|check|fix|update|build|create|schedule|confirm)\b/i;
  const actions=[],points=[];
  sentences.forEach(s=>{if(actionWords.test(s))actions.push(s);else points.push(s);});
  let keyPoints=points.length?points:sentences;
  keyPoints=[...keyPoints].sort((a,b)=>b.length-a.length).slice(0,4);
  keyPoints=sentences.filter(s=>keyPoints.includes(s)).slice(0,4);
  if(!keyPoints.length)keyPoints=sentences.slice(0,3);
  let out='';
  if(sub)out+='Subject: '+sub+'\n';
  if(att)out+='Attendees: '+att+'\n';
  if(sub||att)out+='\n';
  out+='Key points:\n';
  keyPoints.forEach(p=>{out+='• '+p+'\n';});
  if(actions.length){out+='\nAction items:\n';actions.slice(0,6).forEach(x=>{out+='• '+x+'\n';});}
  return out.trim();
}
function addNote(aId){
  const bodyEl=document.getElementById('nt-body');
  const body=bodyEl.value.trim();
  if(!body){bodyEl.focus();bodyEl.style.borderColor='var(--red)';setTimeout(()=>bodyEl.style.borderColor='',1200);return;}
  const cd=document.getElementById('nt-date').value;
  const a=accounts.find(a=>a.id===aId);
  a.notes.unshift({
    id:Date.now(),
    title:document.getElementById('nt-title').value.trim()||tr('untitledCall'),
    sub:document.getElementById('nt-sub').value.trim(),
    att:document.getElementById('nt-att').value.trim(),
    dateRaw:cd||todayISO(),body,sum:'',showRaw:false
  });
  save();renderDetail();renderAll();
}
function refreshNotes(){save();renderDetail();renderGlobalView();renderAll();}
function summarizeNote(aId,nId){
  const a=accounts.find(a=>a.id===aId);const n=a&&a.notes.find(n=>n.id===nId);if(!n)return;
  n.sum=localSummarize(n.body,n.sub,n.att);collapsedSummaries.delete(nId);refreshNotes();
}
function deleteNote(aId,nId){
  if(!confirm(tr('confirmDelete')))return;
  const a=accounts.find(a=>a.id===aId);a.notes=a.notes.filter(n=>n.id!==nId);refreshNotes();
}
function toggleRaw(aId,nId){const a=accounts.find(a=>a.id===aId);const n=a.notes.find(n=>n.id===nId);n.showRaw=!n.showRaw;refreshNotes();}
function toggleSummary(nId){if(collapsedSummaries.has(nId))collapsedSummaries.delete(nId);else collapsedSummaries.add(nId);renderDetail();renderGlobalView();}
function startEditNote(aId,nId){editingNotes.add(nId);renderDetail();renderGlobalView();}
function cancelEditNote(aId,nId){editingNotes.delete(nId);renderDetail();renderGlobalView();}
function saveEditNote(aId,nId){
  const a=accounts.find(a=>a.id===aId);const n=a&&a.notes.find(n=>n.id===nId);if(!n)return;
  const title=document.getElementById(`ne-title-${nId}`).value.trim();if(!title)return;
  n.title=title;
  n.sub=document.getElementById(`ne-sub-${nId}`).value.trim();
  n.att=document.getElementById(`ne-att-${nId}`).value.trim();
  const cd=document.getElementById(`ne-date-${nId}`).value;if(cd)n.dateRaw=cd;
  n.body=document.getElementById(`ne-body-${nId}`).value;
  editingNotes.delete(nId);refreshNotes();
}
function noteEditForm(n,acctId){
  return `
    <div class="nc-body" style="border-top:.5px solid var(--border);">
      <p class="fl">${tr('callTitle')}</p>
      <input class="f" id="ne-title-${n.id}" value="${esc(n.title)}" />
      <div class="work-only"><p class="fl">${tr('subject')}</p>
      <input class="f" id="ne-sub-${n.id}" value="${esc(n.sub||'')}" /></div>
      <div class="r2" style="margin-bottom:10px;">
        <div><p class="fl">${tr('date')}</p><input class="f" id="ne-date-${n.id}" type="date" value="${n.dateRaw||''}" style="margin-bottom:0;" /></div>
        <div class="work-only"><p class="fl">${tr('attendees')}</p><input class="f" id="ne-att-${n.id}" value="${esc(n.att||'')}" style="margin-bottom:0;" /></div>
      </div>
      <p class="fl">${tr('notes')}</p>
      <textarea class="f" id="ne-body-${n.id}" style="min-height:120px;margin-bottom:12px;">${esc(n.body||'')}</textarea>
      <div style="display:flex;gap:8px;">
        <button class="tb tf" onclick="saveEditNote(${acctId},${n.id})">${tr('saveChanges')}</button>
        <button class="tb" onclick="cancelEditNote(${acctId},${n.id})">${tr('cancel')}</button>
      </div>
    </div>`;
}


/* ---------- APP POLISH ---------- */
const EMOJIS=['📋','🛒','✈️','💼','🏠','🎯','📚','💡','💪','🎨','💰','❤️','🧑‍💻','🚀','📅','🌿'];
let newEmoji='📋',emojiCallbacks={};
function renderEmojiPicker(id,selected,onPick){
  const el=document.getElementById(id);if(!el)return;
  emojiCallbacks[id]=onPick;
  el.innerHTML=EMOJIS.map((e,i)=>`<button type="button" class="${e===selected?'picked':''}" aria-label="Choose ${e}" onclick="pickEmoji('${id}',${i})">${e}</button>`).join('');
}
function pickEmoji(id,index){const cb=emojiCallbacks[id];if(cb)cb(EMOJIS[index]);renderEmojiPicker(id,EMOJIS[index],cb);}
function progressRing(a,color){const total=a.tasks.length,done=a.tasks.filter(t=>t.status==='done').length,pct=total?Math.round(done/total*100):0;return `<div class="progress-ring" title="${done} of ${total} complete" style="--pct:${pct};--ring:${color}"><span>${pct}%</span></div>`;}
function renderToday(){
 const el=document.getElementById('detail'),today=todayISO(),all=accounts.flatMap(a=>a.tasks.map(t=>({a,t}))),open=all.filter(x=>x.t.status!=='done'),due=open.filter(x=>x.t.due===today),overdue=open.filter(x=>x.t.due&&x.t.due<today),done=all.filter(x=>x.t.status==='done');
 const name=(profile.name||'').trim().split(/\s+/)[0];
 const rows=[...overdue,...due].sort((x,y)=>(x.t.due||'').localeCompare(y.t.due||''));
 el.innerHTML=`<section class="today-hero"><h2>✨ ${name?tr('hi')+', '+esc(name):profile.lang==='es'?'Tu día, de un vistazo':'Your day at a glance'}</h2><p>${new Date().toLocaleDateString(LOCALES[profile.lang],{weekday:'long',month:'long',day:'numeric'})} · ${accounts.length} ${tr('accounts').toLowerCase()}</p></section><div class="today-grid"><div class="today-tile"><strong>${due.length}</strong><span>${tr('dueToday')}</span></div><div class="today-tile"><strong>${overdue.length}</strong><span>${tr('overdue')}</span></div><div class="today-tile"><strong>${done.length}/${all.length}</strong><span>${tr('completed')}</span></div></div><h3 style="margin:22px 0 12px">📅 ${tr('today')}</h3>${rows.length?rows.map(({a,t})=>`<div class="today-item"><div><div style="font-weight:600">${esc(t.text)}</div><small>${esc(a.emoji||'📋')} ${esc(a.name)} · ${t.due<today?tr('overdue'):tr('dueToday')}</small></div><button class="tb" onclick="selectA(${a.id});openDrawer(${a.id},${t.id})">${tr('view')} →</button></div>`).join(''):`<div class="today-item">🎉 ${profile.lang==='es'?'¡No tienes tareas pendientes para hoy!':'All clear for today! Add a task or choose a list.'}</div>`}<button class="add-acct-btn" style="max-width:220px" onclick="openModal()">${tr('addAccountPlus')}</button>`;
}
function celebrate(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const root=document.createElement('div');root.className='celebration';document.body.appendChild(root);const colors=['#1D9E75','#F5A623','#4A9EE8','#E24B4A','#A78BFA'];for(let i=0;i<34;i++){const e=document.createElement('i');e.className='confetti-piece';e.style.background=colors[i%colors.length];const angle=Math.random()*Math.PI*2,radius=80+Math.random()*220;e.style.setProperty('--dx',Math.cos(angle)*radius+'px');e.style.setProperty('--dy',Math.sin(angle)*radius+'px');e.style.setProperty('--rot',Math.random()*900+'deg');root.appendChild(e)}setTimeout(()=>root.remove(),950);}
let draggedTask=null;
function dragTask(e,aId,tId){draggedTask={aId,tId};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',`${aId}:${tId}`);e.currentTarget.classList.add('dragging');}
function endDrag(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));draggedTask=null;}
function allowDrop(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drop-target');}
function leaveDrop(e){if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('drop-target');}
function dropTask(e,aId,status){e.preventDefault();if(!isWork()&&status!=='done'&&status!=='todo')return;e.currentTarget.classList.remove('drop-target');if(!draggedTask||draggedTask.aId!==aId)return;const a=accounts.find(x=>x.id===aId),t=a&&a.tasks.find(x=>x.id===draggedTask.tId);if(!t)return;const old=t.status;t.status=status;draggedTask=null;afterTaskChange();if(old!=='done'&&status==='done')celebrate();}

document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
applyStatic();
applyTheme();
renderHeader();
renderAll();
renderEmpty();
checkReminders();

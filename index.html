  const note={...d.note,id:Date.now(),sum:'',showRaw:false,approvedDecisions:[],approvedFollowups:[]};
  const selected=d.items.filter(x=>x.approved&&x.text.trim());
  for(const [i,item] of selected.entries()){
    if(item.type==='task')a.tasks.unshift({id:Date.now()+i+1,text:item.text.trim(),status:'todo',priority:'',due:item.due||'',assignee:item.owner||'',sourceNoteId:note.id,sourceMeetingTitle:note.title,remindBefore:item.remindBefore||''});
    if(item.type==='decision')note.approvedDecisions.push(item.text.trim());
    if(item.type==='followup')note.approvedFollowups.push(item.text.trim());
  }
  a.notes.unshift(note);smartDraft=null;save();renderDetail();renderAll();toast('Meeting saved with '+selected.length+' approved items.');
}

/* ---------- RECOMMENDATIONS REVIEW (LOCAL, RULE-BASED PREVIEW) ---------- */
let pendingRecommendations=null;
function extractMeetingRecommendations(note){
  const lines=String(note.body||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const results=[],seen=new Set();
  let section='';
  for(const line of lines){
    const heading=line.replace(/[:\s]+$/,'').toLowerCase();
    if(/^(action items|decisions and reasons|decisions|open questions or blockers|follow-ups|follow ups|key discussion points)$/.test(heading)){section=heading;continue;}
    if(/^(subject|attendees|coverage|sample transcript)/i.test(line))continue;
    const content=line.replace(/^[•*\-]\s*/,'').trim();
    if(!content||content.length<12)continue;
    let type='';
    if(section==='action items')type='task';
    else if(section==='decisions and reasons'||section==='decisions')type='decision';
    else if(section==='follow-ups'||section==='follow ups')type='followup';
    else if(/^(?:follow up|check back|reconnect|schedule a follow-up)\b/i.test(content))type='followup';
    else if(/^(?:decision:|decided:|agreed:)\s*/i.test(content))type='decision';
    else if(/^(?:action:|task:|todo:|to do:)\s*/i.test(content))type='task';
    if(!type)continue;
    const key=type+':'+content.toLowerCase();
    if(seen.has(key))continue;
    seen.add(key);
    const ownerMatch=content.match(/\bOwner:\s*([^;,.]+?)(?=\s*[;,.]|\s+deadline:|\s+due:|$)/i);
    const dueMatch=content.match(/\b(?:deadline|due):\s*([^;,.]+)/i);
    const owner=ownerMatch&&!/^(not stated|unknown|unassigned)$/i.test(ownerMatch[1].trim())?ownerMatch[1].trim():'';
    const dueText=dueMatch&&!/^(not stated|unknown|none)$/i.test(dueMatch[1].trim())?dueMatch[1].trim():'';
    const isoDue=/^\d{4}-\d{2}-\d{2}$/.test(dueText)?dueText:'';
    results.push({id:results.length,type,text:content,owner,due:isoDue,dueText,approved:false});
  }
  // Dialogue preview: detect explicit commitments and decisions in speaker-labelled transcripts.
  // This is deliberately conservative; uncertain assignments remain unassigned.
  if(!results.length){
    const entries=lines.map(line=>{
      const m=line.match(/^(?:\[(\d{1,2}:\d{2})\]\s*)?([^:]{2,35}):\s*(.+)$/);
      return m?{speaker:m[2].trim(),message:m[3].trim(),time:m[1]||''}:null;
    }).filter(Boolean);
    const dateBase=new Date((note.dateRaw||todayISO())+'T12:00:00');
    const dueFrom=(msg)=>{
      const iso=msg.match(/\b20\d{2}-\d{2}-\d{2}\b/);
      if(iso)return iso[0];
      const full=msg.match(/\b(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),?\s+(?:November|December|January|February|March|April|May|June|July|August|September|October)\s+\d{1,2}(?:,\s*20\d{2})?/i);
      if(full){const dt=new Date(full[0]+(full[0].match(/20\d{2}/)?'':', '+dateBase.getFullYear()));return isNaN(dt)?'':isoOf(dt);}
      if(/\btomorrow\b/i.test(msg)){const dt=new Date(dateBase);dt.setDate(dt.getDate()+1);return isoOf(dt);}
      if(/\b(?:today|end of today)\b/i.test(msg))return isoOf(dateBase);
      return '';
    };
    const add=(type,text,owner,due)=>{
      const clean=text.trim();if(clean.length<10)return;
      const key=type+':'+clean.toLowerCase();if(seen.has(key))return;
      seen.add(key);results.push({id:results.length,type,text:clean,owner:owner||'',due:due||'',dueText:'',approved:false});
    };
    for(let i=0;i<entries.length;i++){
      const {speaker,message,time}=entries[i];
      const next=entries[i+1];
      // Direct assignment: "Raji, could you prepare..." / "Sahana, please..."
      const assign=message.match(/^([A-Z][a-z]+),?\s+(?:can you|could you|please|would you)\s+(.+?)(?:\?|$)/i);
      if(assign)add('task',assign[2].replace(/\?$/,'')+' ('+speaker+' requested)',assign[1],dueFrom(message+' '+(next?.message||'')));
      // Explicit personal commitment.
      const promise=message.match(/^(?:yes,?\s*)?(?:sure,?\s*)?I(?:'ll| will| can)\s+(.+?)(?:[.!]|$)/i);
      if(promise&&!/^(?:help|have|be|need)\b/i.test(promise[1]))add('task',promise[1],speaker,dueFrom(message));
      if(/\b(?:let's|we will|we should)\s+(?:tentatively\s+)?(?:move|postpone|delay|prioritize|include|schedule|hold off|not release)\b/i.test(message)||/\b(?:agreed|the decision is)\b/i.test(message)){
        add('decision',message,'','');
      }
      if(/\b(?:follow up|check with|confirm with|send reminders|coordinate with)\b/i.test(message)){
        add('followup',message,speaker,dueFrom(message));
      }
    }
    // Preserve the latest explicitly stated deadline for an owner's matching task.
    for(const item of results.filter(x=>x.type==='task'&&x.owner)){
      const related=entries.filter(e=>e.speaker.toLowerCase()===item.owner.toLowerCase()&&/\b(?:deadline|instead of|by Monday|by Tuesday|by Wednesday|by Thursday|by Friday|change that)\b/i.test(e.message));
      if(related.length&&/design/i.test(item.text)){
        const last=related[related.length-1];const newDue=dueFrom(last.message);
        if(newDue)item.due=newDue;
      }
    }
  }
  return results;
}
function openRecommendations(aId,nId){
  const acct=accounts.find(a=>a.id===aId),note=acct&&acct.notes.find(n=>n.id===nId);
  if(!note)return;
  const items=extractMeetingRecommendations(note);
  pendingRecommendations={aId,nId,items};
  renderRecommendations();
}
function recommendationRow(item,i){
  const labels={task:'Create task',followup:'Add follow-up',decision:'Save decision'};
  return '<div style="border:1px solid var(--border);border-radius:12px;padding:12px;margin:8px 0;">'+
    '<label style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;"><input type="checkbox" '+(item.approved?'checked':'')+' onchange="toggleRecommendation('+i+',this.checked)" />'+labels[item.type]+'</label>'+
    '<label class="fl" style="margin-top:10px;">Review / edit suggestion</label>'+
    '<textarea class="f" style="min-height:62px;" oninput="editRecommendation('+i+',\'text\',this.value)">'+esc(item.text)+'</textarea>'+
    (item.type==='task'?'<div class="r2"><div><label class="fl">Owner (optional)</label><input class="f" value="'+esc(item.owner)+'" oninput="editRecommendation('+i+',\'owner\',this.value)" /></div><div><label class="fl">Due date (optional)</label><input class="f" type="date" value="'+esc(item.due)+'" onchange="editRecommendation('+i+',\'due\',this.value)" /></div></div>'+(item.dueText&&!item.due?'<div style="font-size:12px;color:var(--muted);">Mentioned deadline: '+esc(item.dueText)+' — choose an exact date only if known.</div>':''):'')+
    '</div>';
}
function renderRecommendations(){
  const p=pendingRecommendations;if(!p)return;
  const el=document.getElementById('recommendations-'+p.aId+'-'+p.nId);if(!el)return;
  el.innerHTML='<div class="add-card" style="margin:10px 0;">'+
    '<div class="add-card-title">Review recommendations</div>'+
    '<p style="font-size:12px;color:var(--muted);">Local rule-based suggestions, not an AI service. Nothing is saved until you select and approve. Review every suggestion for accuracy.</p>'+
    (p.items.length?p.items.map(recommendationRow).join(''):'<p style="font-size:13px;color:var(--muted);">No structured actions found. Add headings such as Action Items, Decisions and Reasons, or Follow-ups to your notes, then try again.</p>')+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="add-btn2" onclick="approveRecommendations()">Approve selected</button><button class="tb" onclick="cancelRecommendations()">Cancel</button></div></div>';
}
function toggleRecommendation(i,checked){if(pendingRecommendations?.items[i])pendingRecommendations.items[i].approved=checked;}
function editRecommendation(i,field,value){if(pendingRecommendations?.items[i])pendingRecommendations.items[i][field]=value;}
function cancelRecommendations(){const p=pendingRecommendations;pendingRecommendations=null;if(p){const el=document.getElementById('recommendations-'+p.aId+'-'+p.nId);if(el)el.innerHTML='';}}
function approveRecommendations(){
  const p=pendingRecommendations;if(!p)return;
  const acct=accounts.find(a=>a.id===p.aId),note=acct&&acct.notes.find(n=>n.id===p.nId);
  if(!acct||!note)return;
  const chosen=p.items.filter(x=>x.approved&&x.text.trim());
  if(!chosen.length){toast('Select at least one recommendation.');return;}
  let count=0;
  for(const item of chosen){
    const text=item.text.trim();
    if(item.type==='task'){
      if(acct.tasks.some(t=>t.sourceNoteId===p.nId&&t.sourceRecommendation===text))continue;
      acct.tasks.unshift({id:Date.now()+count,text,status:'todo',priority:'',due:item.due||'',assignee:item.owner||'',sourceNoteId:p.nId,sourceMeetingTitle:note.title,sourceRecommendation:text});count++;
    }else if(item.type==='decision'){
      note.approvedDecisions=note.approvedDecisions||[];
      if(!note.approvedDecisions.includes(text)){note.approvedDecisions.push(text);count++;}
    }else if(item.type==='followup'){
      note.approvedFollowups=note.approvedFollowups||[];
      if(!note.approvedFollowups.includes(text)){note.approvedFollowups.push(text);count++;}
    }
  }
  pendingRecommendations=null;
  save();renderDetail();renderGlobalView();renderAll();
  toast(count+' approved recommendation(s) saved.');
}

/* ---------- NOTES ---------- */
function localSummarize(body,sub,att){
  const lines=body.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  let sentences=[];
  lines.forEach(l=>{l.split(/(?<=[.!?])\s+/).forEach(s=>{if(s.trim())sentences.push(s.trim());});});
  if(!sentences.length)sentences=[body.trim()];
  const actionWords=/\b(will|need to|needs to|should|must|to do|todo|action|follow up|follow-up|let's|lets|plan to|going to|next step|next steps|assign|ship|send|review|check|fix|update|build|create|schedule|confirm)\b/i;
  const actions=[],points=[];
  sentences.forEach(s=>{if(actionWords.test(s))actions.push(s);else points.push(s);});
  let keyPoints=points.length?points:sentences;
  keyPoints=[...keyPoints].sort((a,b)=>b.length-a.length).slice(0,4);
  keyPoints=sentences.filter(s=>keyPoints.includes(s)).slice(0,4);
  if(!keyPoints.length)keyPoints=sentences.slice(0,3);
  let out='';
  if(sub)out+='Subject: '+sub+'\n';
  if(att)out+='Attendees: '+att+'\n';
  if(sub||att)out+='\n';
  out+='Key points:\n';
  keyPoints.forEach(p=>{out+='• '+p+'\n';});
  if(actions.length){out+='\nAction items:\n';actions.slice(0,6).forEach(x=>{out+='• '+x+'\n';});}
  return out.trim();
}
function addNote(aId){
  const bodyEl=document.getElementById('nt-body');
  const body=bodyEl.value.trim();
  if(!body){bodyEl.focus();bodyEl.style.borderColor='var(--red)';setTimeout(()=>bodyEl.style.borderColor='',1200);return;}
  const cd=document.getElementById('nt-date').value;
  const a=accounts.find(a=>a.id===aId);
  a.notes.unshift({
    id:Date.now(),
    title:document.getElementById('nt-title').value.trim()||tr('untitledCall'),
    sub:document.getElementById('nt-sub').value.trim(),
    att:document.getElementById('nt-att').value.trim(),
    dateRaw:cd||todayISO(),body,sum:'',showRaw:false
  });
  save();renderDetail();renderAll();
}

function summarizeNote(aId,nId){
  const a=accounts.find(a=>a.id===aId);const n=a&&a.notes.find(n=>n.id===nId);if(!n)return;
  n.sum=localSummarize(n.body,n.sub,n.att);collapsedSummaries.delete(nId);refreshNotes();
}
function deleteNote(aId,nId){
  if(!confirm(tr('confirmDelete')))return;

function toggleRaw(aId,nId){const a=accounts.find(a=>a.id===aId);const n=a.notes.find(n=>n.id===nId);n.showRaw=!n.showRaw;refreshNotes();}
function toggleSummary(nId){if(collapsedSummaries.has(nId))collapsedSummaries.delete(nId);else collapsedSummaries.add(nId);renderDetail();renderGlobalView();}
function startEditNote(aId,nId){editingNotes.add(nId);renderDetail();renderGlobalView();}
function cancelEditNote(aId,nId){editingNotes.delete(nId);renderDetail();renderGlobalView();}
function saveEditNote(aId,nId){
  const a=accounts.find(a=>a.id===aId);const n=a&&a.notes.find(n=>n.id===nId);if(!n)return;
  const title=document.getElementById(`ne-title-${nId}`).value.trim();if(!title)return;
  n.title=title;
  n.sub=document.getElementById(`ne-sub-${nId}`).value.trim();
  n.att=document.getElementById(`ne-att-${nId}`).value.trim();
  const cd=document.getElementById(`ne-date-${nId}`).value;if(cd)n.dateRaw=cd;
  n.body=document.getElementById(`ne-body-${nId}`).value;

}

/* ---------- APP POLISH ---------- */
const EMOJIS=['📋','💼','🎯','📚','💡','🧑‍💻','🚀','📅','📊','🗂️','🤝','📝','🔧','📣','🧪','🏢'];
let newEmoji='📋',emojiCallbacks={};
function renderEmojiPicker(id,selected,onPick){
  const el=document.getElementById(id);if(!el)return;
  emojiCallbacks[id]=onPick;
  el.innerHTML=EMOJIS.map((e,i)=>`<button type="button" class="${e===selected?'picked':''}" aria-label="Choose ${e}" onclick="pickEmoji('${id}',${i})">${e}</button>`).join('');
}
function pickEmoji(id,index){const cb=emojiCallbacks[id];if(cb)cb(EMOJIS[index]);renderEmojiPicker(id,EMOJIS[index],cb);}
function progressRing(a,color){const total=a.tasks.length,done=a.tasks.filter(t=>t.status==='done').length,pct=total?Math.round(done/total*100):0;return `<div class="progress-ring" title="${done} of ${total} complete" style="--pct:${pct};--ring:${color}"><span>${pct}%</span></div>`;}
function renderToday(){
 const el=document.getElementById('detail'),today=todayISO(),all=accounts.flatMap(a=>a.tasks.map(t=>({a,t}))),open=all.filter(x=>x.t.status!=='done'),due=open.filter(x=>x.t.due===today),overdue=open.filter(x=>x.t.due&&x.t.due<today),done=all.filter(x=>x.t.status==='done');
 const es=profile.lang==='es';
 const name=(profile.name||'').trim().split(/\s+/)[0];
 const hr=new Date().getHours();
 const greet=es?(hr<12?'Buenos días':hr<19?'Buenas tardes':'Buenas noches'):(hr<12?'Good morning':hr<17?'Good afternoon':'Good evening');
 const pct=all.length?Math.round(done.length/all.length*100):0;
 const rows=[...overdue,...due].sort((x,y)=>(x.t.due||'').localeCompare(y.t.due||''));
 const dateStr=new Date().toLocaleDateString(LOCALES[profile.lang],{weekday:'long',month:'long',day:'numeric'});
 const sub=accounts.length?(es?`${open.length} tareas abiertas en ${accounts.length} ${tr('accounts').toLowerCase()}`:`${open.length} open task${open.length===1?'':'s'} across ${accounts.length} ${accounts.length===1?'account':'accounts'}`):(es?'Crea tu primera cuenta para empezar.':'Create your first account to get started.');
 const tile=(c,icn,n,label)=>`<div class="today-tile" style="--c:${c}"><div class="t-ic">${ic(icn)}</div><div><strong>${n}</strong><span>${label}</span></div></div>`;
 const empty=accounts.length
  ?`<div class="today-item today-empty"><div class="big">🎉</div><b>${es?'¡Todo listo por hoy!':'All clear for today'}</b><span>${es?'No tienes tareas vencidas ni para hoy.':'Nothing overdue or due today. Enjoy the calm.'}</span></div>`
  :`<div class="today-item today-empty"><div class="big">🚀</div><b>${es?'Empieza tu tablero':'Start your board'}</b><span>${es?'Añade una cuenta para organizar tareas y reuniones.':'Add an account to organize tasks and smart meeting notes.'}</span><button class="add-btn" style="margin-top:14px" onclick="openModal()">${tr('addAccountPlus')}</button></div>`;
 el.innerHTML=`<section class="today-hero"><div><div class="eyebrow">${ic('spark','sm')} ${esc(dateStr)}</div><h2>${greet}${name?', '+esc(name):''}</h2><p>${esc(sub)}</p></div><div class="hero-ring" style="--pct:${pct}"><div><div><strong>${pct}%</strong><span>${es?'hecho':'done'}</span></div></div></div></section>
 <div class="today-grid">${tile('var(--amber)','clock',due.length,tr('dueToday'))}${tile('var(--red)','alert',overdue.length,tr('overdue'))}${tile('var(--accent)','check',`${done.length}<small style="font-size:14px;color:var(--muted);font-weight:700">/${all.length}</small>`,tr('completed'))}</div>
 <h3 class="sec-h">${ic('cal')} ${tr('today')}</h3>
 ${rows.length?rows.map(({a,t})=>{const ov=t.due<today;return `<div class="today-item"><div style="min-width:0"><div style="font-weight:650;overflow-wrap:anywhere">${esc(t.text)}</div><small>${esc(a.emoji||'📋')} ${esc(a.name)} · <span class="due-tag ${ov?'ov':'td'}">${ov?tr('overdue'):tr('dueToday')}</span></small></div><button class="tb tf" onclick="selectA(${a.id});openDrawer(${a.id},${t.id})">${tr('view')} ${ic('arrow','sm')}</button></div>`;}).join(''):empty}
 ${accounts.length?`<button class="add-acct-btn" style="max-width:240px" onclick="openModal()">${tr('addAccountPlus')}</button>`:''}`;
}
function celebrate(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const root=document.createElement('div');root.className='celebration';document.body.appendChild(root);const colors=['#1D9E75','#F5A623','#4A9EE8','#E24B4A','#A78BFA'];for(let i=0;i<34;i++){const e=document.createElement('i');e.className='confetti-piece';e.style.background=colors[i%colors.length];const angle=Math.random()*Math.PI*2,radius=80+Math.random()*220;e.style.setProperty('--dx',Math.cos(angle)*radius+'px');e.style.setProperty('--dy',Math.sin(angle)*radius+'px');e.style.setProperty('--rot',Math.random()*900+'deg');root.appendChild(e)}setTimeout(()=>root.remove(),950);}
let draggedTask=null;
function dragTask(e,aId,tId){draggedTask={aId,tId};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',`${aId}:${tId}`);e.currentTarget.classList.add('dragging');}
function endDrag(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));draggedTask=null;}
function allowDrop(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drop-target');}
function leaveDrop(e){if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('drop-target');}
function dropTask(e,aId,status){e.preventDefault();if(!isWork()&&status!=='done'&&status!=='todo')return;e.currentTarget.classList.remove('drop-target');if(!draggedTask||draggedTask.aId!==aId)return;const a=accounts.find(x=>x.id===aId),t=a&&a.tasks.find(x=>x.id===draggedTask.tId);if(!t)return;const old=t.status;t.status=status;draggedTask=null;afterTaskChange();if(old!=='done'&&status==='done')celebrate();}
